<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>準備中…</title>
<style>
  :root{
    --ink:#1c2b24;
    --paper:#f6f4ee;
    --line:#c9c2ae;
    --accent:#2f5d4f;
    --error:#a3402f;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{ text-align:center; max-width:420px; }
  p{ font-size:14px; line-height:1.8; color:#4b554e; }
  .error{
    color:var(--error);
    background:#fbeae6;
    border:1px solid #e6c3ba;
    padding:14px 16px;
    border-radius:2px;
    font-size:13px;
    display:none;
    text-align:left;
  }
</style>
</head>
<body>
  <div class="card">
    <p id="statusText">移動しています…</p>
    <div class="error" id="errorBox"></div>
  </div>

<script>
  // このページはネットワーク通信を行わず、サイト2から渡された情報を使って
  // 即座にサイト4へ振り分けるだけの中継ページ（体感速度改善のため）。
  const BASE_URL = "https://tomotakasuye191.github.io/CO-SE-ver1/";
  const SITE4_URL = BASE_URL + "site4/index.html";

  const urlParams = new URLSearchParams(window.location.search);
  function getParam(key){
    return urlParams.get(key) || sessionStorage.getItem('experiment_' + key) || '';
  }

  const id = getParam('id');
  const group = getParam('group');
  const good1 = getParam('good1');
  const good2 = getParam('good2');
  const current = getParam('current') || '1';
  const good = urlParams.get('good') || (current === '1' ? good1 : good2);
  const item1 = urlParams.get('item1');
  const item2 = urlParams.get('item2');

  const errorBox = document.getElementById('errorBox');
  function showError(text){
    document.getElementById('statusText').style.display = 'none';
    errorBox.textContent = text;
    errorBox.style.display = 'block';
  }

  if(!id || !good || !item1 || !item2){
    showError('必要な情報が見つかりませんでした。最初のページからやり直してください。');
  } else {
    const hasImage = (item1 === 'image' || item2 === 'image');
    const otherItem = hasImage ? (item1 === 'image' ? item2 : item1) : '';

    const query = new URLSearchParams({
      id: id, group: group, good1: good1, good2: good2, current: current,
      good: good, item1: item1, item2: item2,
      hasImage: hasImage ? '1' : '0', otherItem: otherItem
    });
    window.location.href = SITE4_URL + '?' + query.toString();
  }
</script>

</body>
</html>
